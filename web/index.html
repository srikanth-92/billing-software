<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Buffet on Wheels</title>
    <style id="expo-reset">
      html, body {
        height: 100%;
        /* Prevent the whole page from shifting when a child overflows on iOS Safari */
        overflow: hidden;
        position: fixed;
        width: 100%;
        /* Extra safety: no horizontal scroll at any level */
        max-width: 100vw;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        overflow: hidden;
        max-width: 100vw;
      }
      /* Ensure Razorpay modal appears on top with proper visibility */
      .razorpay-container {
        position: fixed !important;
        z-index: 999999 !important;
        overflow: auto !important;
      }
      iframe[name="razorpay-checkout-frame"] {
        position: fixed !important;
        z-index: 999999 !important;
      }
    </style>
    <link rel="icon" href="/favicon.ico" />
    <!-- Capture Razorpay redirect params into sessionStorage before React
         Navigation processes the URL and strips the query string. -->
    <script>
      (function () {
        var p = new URLSearchParams(window.location.search);
        var pid = p.get('razorpay_payment_id');
        if (pid) {
          sessionStorage.setItem('rzp_payment_params', JSON.stringify({
            razorpay_payment_id: pid,
            razorpay_order_id: p.get('razorpay_order_id') || '',
            razorpay_signature: p.get('razorpay_signature') || '',
          }));
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- In-app browser gate: runs before React loads. If the page is opened inside
         a WebView (Paytm, PhonePe, WhatsApp, Instagram, etc.), show a dismissible
         banner suggesting Chrome/Safari but allow the app to work. -->
    <script>
      (function () {
        var ua = navigator.userAgent || '';
        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        var inApp = false;

        if (isAndroid) {
          // Detect standalone browsers vs WebView/in-app browsers
          var standalone =
            (/Chrome\/\d/.test(ua) && !/wv\b/.test(ua) && !/Version\/[\d.]+/.test(ua)) ||
            /SamsungBrowser\/\d/.test(ua) ||
            /Firefox\/\d/.test(ua) ||
            /OPR\/\d/.test(ua) ||
            /EdgA\/\d/.test(ua) ||
            /Brave\//.test(ua) ||
            /DuckDuckGo\//.test(ua) ||
            /Vivaldi\//.test(ua);
          inApp = !standalone;
        } else if (isIOS) {
          // Real Safari always has "Version/X.X Safari/" — WKWebView/in-app never does
          inApp = (
            !/Version\/[\d.]+ .*Safari\//.test(ua) &&
            !/CriOS\/\d/.test(ua) &&
            !/FxiOS\/\d/.test(ua) &&
            !/EdgiOS\/\d/.test(ua)
          );
        }

        if (!inApp) return;

        console.log('[InAppGate] Detected in-app browser, UA:', ua);

        // Show dismissible banner at the top instead of blocking
        // This allows the app to work while suggesting a better experience
        setTimeout(function() {
          showBrowserBanner();
        }, 1000);

        function showBrowserBanner() {
          // Don't show if user already dismissed
          if (sessionStorage.getItem('bow_banner_dismissed')) return;

          var url = window.location.href;
          var banner = document.createElement('div');
          banner.id = 'bow-browser-banner';
          banner.style.cssText = [
            'position:fixed;top:0;left:0;right:0;z-index:999998;',
            'background:linear-gradient(135deg, #c9a84c 0%, #a58935 100%);',
            'color:#1a1a2e;padding:12px 16px;box-shadow:0 2px 8px rgba(0,0,0,0.3);',
            'font-family:-apple-system,BlinkMacSystemFont,sans-serif;',
            'display:flex;align-items:center;justify-content:space-between;gap:12px;',
            'animation:slideDown 0.3s ease-out;'
          ].join('');

          banner.innerHTML = [
            '<style>@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}</style>',
            '<div style="flex:1;font-size:13px;line-height:1.4">',
              '<strong style="display:block;margin-bottom:2px;font-weight:700">📱 Better in ' + (isIOS ? 'Safari' : 'Chrome') + '</strong>',
              '<span style="font-size:12px;opacity:0.9">Payments work better in your default browser</span>',
            '</div>',
            '<button id="bow-open-btn" style="',
              'background:#1a1a2e;color:#c9a84c;border:none;border-radius:8px;',
              'padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;',
              'white-space:nowrap;-webkit-tap-highlight-color:transparent;',
            '">Open</button>',
            '<button id="bow-dismiss-btn" style="',
              'background:transparent;color:#1a1a2e;border:none;',
              'font-size:24px;line-height:1;cursor:pointer;padding:0 4px;',
              '-webkit-tap-highlight-color:transparent;opacity:0.7;',
            '">×</button>'
          ].join('');

          document.body.appendChild(banner);

          // Add padding to root so content isn't hidden behind banner
          var root = document.getElementById('root');
          if (root) {
            root.style.paddingTop = banner.offsetHeight + 'px';
          }

          document.getElementById('bow-open-btn').addEventListener('click', function () {
            console.log('[InAppGate] User tapped "Open" in banner');
            if (isAndroid) {
              var noScheme = url.replace(/^https?:\/\//, '');
              window.location.href = 'intent://' + noScheme +
                '#Intent;scheme=https;action=android.intent.action.VIEW;' +
                'category=android.intent.category.BROWSABLE;end';
              setTimeout(function() { window.open(url, '_system'); }, 300);
            } else {
              window.open(url, '_system');
            }
          });

          document.getElementById('bow-dismiss-btn').addEventListener('click', function () {
            console.log('[InAppGate] User dismissed banner');
            sessionStorage.setItem('bow_banner_dismissed', 'true');
            banner.style.animation = 'slideDown 0.2s ease-in reverse';
            setTimeout(function() {
              banner.remove();
              if (root) root.style.paddingTop = '0';
            }, 200);
          });
        }
      })();
    </script>
  </body>
</html>
