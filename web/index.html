<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Buffet on Wheels</title>
    <style id="expo-reset">
      html, body {
        height: 100%;
        /* Prevent the whole page from shifting when a child overflows on iOS Safari */
        overflow: hidden;
        position: fixed;
        width: 100%;
        /* Extra safety: no horizontal scroll at any level */
        max-width: 100vw;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        overflow: hidden;
        max-width: 100vw;
      }
      /* Ensure Razorpay modal appears on top with proper visibility */
      .razorpay-container {
        position: fixed !important;
        z-index: 999999 !important;
        overflow: auto !important;
      }
      iframe[name="razorpay-checkout-frame"] {
        position: fixed !important;
        z-index: 999999 !important;
      }
    </style>
    <link rel="icon" href="/favicon.ico" />
    <!-- Capture Razorpay redirect params into sessionStorage before React
         Navigation processes the URL and strips the query string. -->
    <script>
      (function () {
        var p = new URLSearchParams(window.location.search);
        var pid = p.get('razorpay_payment_id');
        if (pid) {
          sessionStorage.setItem('rzp_payment_params', JSON.stringify({
            razorpay_payment_id: pid,
            razorpay_order_id: p.get('razorpay_order_id') || '',
            razorpay_signature: p.get('razorpay_signature') || '',
          }));
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- In-app browser gate: runs before React loads. If the page is opened inside
         a WebView (Paytm, PhonePe, WhatsApp, Instagram, QR scanner, etc.), redirect
         to Chrome immediately or show interstitial. React never mounts when in-app. -->
    <script>
      (function () {
        var ua = navigator.userAgent || '';
        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        var inApp = false;

        if (isAndroid) {
          // Detect standalone browsers vs WebView/in-app browsers
          var standalone =
            (/Chrome\/\d/.test(ua) && !/wv\b/.test(ua) && !/Version\/[\d.]+/.test(ua)) ||
            /SamsungBrowser\/\d/.test(ua) ||
            /Firefox\/\d/.test(ua) ||
            /OPR\/\d/.test(ua) ||
            /EdgA\/\d/.test(ua) ||
            /Brave\//.test(ua) ||
            /DuckDuckGo\//.test(ua) ||
            /Vivaldi\//.test(ua);
          inApp = !standalone;
        } else if (isIOS) {
          // Real Safari always has "Version/X.X Safari/" — WKWebView/in-app never does
          inApp = (
            !/Version\/[\d.]+ .*Safari\//.test(ua) &&
            !/CriOS\/\d/.test(ua) &&
            !/FxiOS\/\d/.test(ua) &&
            !/EdgiOS\/\d/.test(ua)
          );
        }

        if (!inApp) return;

        console.log('[InAppGate] Detected in-app browser, UA:', ua);

        // Android: Chrome intent redirect works from code, no tap needed
        if (isAndroid) {
          var u = window.location.href;
          var noScheme = u.replace(/^https?:\/\//, '');
          console.log('[InAppGate] Redirecting to Chrome via intent...');
          window.location.href =
            'intent://' + noScheme +
            '#Intent;scheme=https;package=com.android.chrome;' +
            'S.browser_fallback_url=' + encodeURIComponent(
              'intent://' + noScheme +
              '#Intent;scheme=https;action=android.intent.action.VIEW;' +
              'category=android.intent.category.BROWSABLE;end'
            ) + ';end';

          // Fallback: if intent didn't work after 1 second, show interstitial
          setTimeout(function() {
            console.log('[InAppGate] Intent redirect may have failed, showing interstitial');
            showInterstitial();
          }, 1000);
          return;
        }

        // iOS: block React from mounting, show interstitial instead
        console.log('[InAppGate] iOS in-app browser detected, showing interstitial');
        showInterstitial();

        function showInterstitial() {
          var root = document.getElementById('root');
          if (root) root.style.display = 'none';

          var url = window.location.href;
          var overlay = document.createElement('div');
          overlay.id = 'bow-interstitial';
          overlay.style.cssText = [
            'position:fixed;top:0;left:0;width:100%;height:100%;',
            'background:#1a1a2e;z-index:2147483647;',
            'display:flex;flex-direction:column;align-items:center;justify-content:center;',
            'font-family:-apple-system,BlinkMacSystemFont,sans-serif;',
            'padding:32px;box-sizing:border-box;text-align:center;'
          ].join('');
          overlay.innerHTML = [
            '<div style="font-size:64px;margin-bottom:16px">🍽️</div>',
            '<h1 style="color:#c9a84c;font-size:24px;margin:0 0 12px 0;font-weight:700">Buffet on Wheels</h1>',
            '<p style="color:rgba(255,255,255,0.72);font-size:15px;margin:0 0 40px 0;max-width:300px;line-height:1.5">',
              'For the best ordering experience, please open this page in Chrome or Safari.',
            '</p>',
            '<button id="bow-btn" style="',
              'background:#c9a84c;color:#1a1a2e;border:none;border-radius:14px;',
              'padding:18px 0;font-size:18px;font-weight:700;cursor:pointer;',
              'width:100%;max-width:300px;-webkit-tap-highlight-color:transparent;',
              'margin-bottom:16px;',
            '">Open in ' + (isIOS ? 'Safari' : 'Chrome') + '</button>',
            '<p style="color:rgba(255,255,255,0.5);font-size:13px;margin:0;max-width:300px;line-height:1.4">',
              isAndroid
                ? 'Tap the button to open in Chrome. If it doesn\'t work, copy the link and paste in Chrome manually.'
                : 'Tap the button above, then choose "Open in Safari" from the menu.',
            '</p>'
          ].join('');

          if (!document.getElementById('bow-interstitial')) {
            document.body.appendChild(overlay);
          }

          document.getElementById('bow-btn').addEventListener('click', function () {
            console.log('[InAppGate] User tapped "Open in Browser" button');
            if (isAndroid) {
              // Try multiple redirect methods for Android
              window.location.href =
                'intent://' + url.replace(/^https?:\/\//, '') +
                '#Intent;scheme=https;package=com.android.chrome;end';
              setTimeout(function() {
                window.open(url, '_blank');
              }, 500);
            } else {
              // iOS: window.open is the only allowed method from user gesture
              window.open(url, '_blank');
            }
          });
        }
      })();
    </script>
  </body>
</html>
