<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Buffet on Wheels</title>
    <style id="expo-reset">
      html, body {
        height: 100%;
        /* Prevent the whole page from shifting when a child overflows on iOS Safari */
        overflow: hidden;
        position: fixed;
        width: 100%;
        /* Extra safety: no horizontal scroll at any level */
        max-width: 100vw;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        overflow: hidden;
        max-width: 100vw;
      }
    </style>
    <link rel="icon" href="/favicon.ico" />
    <!-- Capture Razorpay redirect params into sessionStorage before React
         Navigation processes the URL and strips the query string. -->
    <script>
      (function () {
        var p = new URLSearchParams(window.location.search);
        var pid = p.get('razorpay_payment_id');
        if (pid) {
          sessionStorage.setItem('rzp_payment_params', JSON.stringify({
            razorpay_payment_id: pid,
            razorpay_order_id: p.get('razorpay_order_id') || '',
            razorpay_signature: p.get('razorpay_signature') || '',
          }));
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
