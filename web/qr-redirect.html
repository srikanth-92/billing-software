<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening in Browser...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #c9a84c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .emoji { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 24px; margin: 0 0 12px 0; font-weight: 700; }
    p { color: rgba(255,255,255,0.72); font-size: 15px; margin: 0 0 24px 0; max-width: 300px; line-height: 1.5; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(201,168,76,0.2);
      border-top-color: #c9a84c;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      background: #c9a84c;
      color: #1a1a2e;
      border: none;
      border-radius: 14px;
      padding: 18px 32px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    .hint {
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      margin-top: 24px;
      max-width: 320px;
    }
  </style>
</head>
<body>
  <div class="emoji">🍽️</div>
  <h1>Buffet on Wheels</h1>
  <p>Redirecting to menu...</p>
  <div class="spinner"></div>
  <p class="hint">If you're not redirected automatically, <a href="#" id="manual-link" style="color:#c9a84c;text-decoration:underline;">click here</a></p>

  <script>
    (function() {
      // Get the target URL from query parameter
      const params = new URLSearchParams(window.location.search);
      const cart = params.get('cart') || 'cart1';
      const targetUrl = 'https://buffet-on-wheels-ba58b.web.app/' + cart + '/guest';

      const ua = navigator.userAgent || '';
      const isAndroid = /Android/i.test(ua);
      const isIOS = /iPhone|iPad|iPod/i.test(ua);

      console.log('[QR Redirect] Target:', targetUrl);
      console.log('[QR Redirect] UA:', ua);
      console.log('[QR Redirect] Platform:', isAndroid ? 'Android' : isIOS ? 'iOS' : 'Other');

      // Just redirect directly - the main app will show the banner if needed
      console.log('[QR Redirect] Direct redirect to:', targetUrl);

      // Redirect immediately
      window.location.href = targetUrl;

      // Manual link as backup
      document.getElementById('manual-link').addEventListener('click', function(e) {
        e.preventDefault();
        console.log('[QR Redirect] Manual link clicked');
        window.location.href = targetUrl;
      });
    })();
  </script>
</body>
</html>
