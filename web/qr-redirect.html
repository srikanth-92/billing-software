<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening in Browser...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #c9a84c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .emoji { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 24px; margin: 0 0 12px 0; font-weight: 700; }
    p { color: rgba(255,255,255,0.72); font-size: 15px; margin: 0 0 24px 0; max-width: 300px; line-height: 1.5; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(201,168,76,0.2);
      border-top-color: #c9a84c;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      background: #c9a84c;
      color: #1a1a2e;
      border: none;
      border-radius: 14px;
      padding: 18px 32px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    .hint {
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      margin-top: 24px;
      max-width: 320px;
    }
  </style>
</head>
<body>
  <div class="emoji">🍽️</div>
  <h1>Buffet on Wheels</h1>
  <p>Opening in your browser...</p>
  <div class="spinner"></div>
  <button class="btn" id="manual-btn" style="display:none;">Open Manually</button>
  <p class="hint" id="hint"></p>

  <script>
    (function() {
      // Get the target URL from query parameter
      const params = new URLSearchParams(window.location.search);
      const cart = params.get('cart') || 'cart1';
      const targetUrl = 'https://buffet-on-wheels-ba58b.web.app/' + cart + '/guest';

      const ua = navigator.userAgent || '';
      const isAndroid = /Android/i.test(ua);
      const isIOS = /iPhone|iPad|iPod/i.test(ua);

      console.log('[QR Redirect] Target:', targetUrl);
      console.log('[QR Redirect] UA:', ua);
      console.log('[QR Redirect] Platform:', isAndroid ? 'Android' : isIOS ? 'iOS' : 'Other');

      let redirected = false;

      function showManualButton() {
        document.getElementById('manual-btn').style.display = 'block';
        document.getElementById('hint').textContent = isAndroid
          ? 'Auto-redirect didn\'t work. Tap "Open Manually" to continue.'
          : 'Tap "Open Manually" then choose Safari from the menu.';
      }

      if (isAndroid) {
        // Android: try multiple redirect strategies
        const noScheme = targetUrl.replace(/^https?:\/\//, '');

        // Strategy 1: Chrome intent with VIEW action
        const intentUrl = 'intent://' + noScheme +
          '#Intent;scheme=https;action=android.intent.action.VIEW;' +
          'package=com.android.chrome;' +
          'S.browser_fallback_url=' + encodeURIComponent(targetUrl) + ';end';

        console.log('[QR Redirect] Trying Chrome intent:', intentUrl);
        window.location.href = intentUrl;
        redirected = true;

        // Strategy 2: Try direct redirect after 500ms as backup
        setTimeout(function() {
          console.log('[QR Redirect] Trying direct window.open fallback');
          window.open(targetUrl, '_blank');
        }, 500);

        // Show manual button after 2 seconds if still on this page
        setTimeout(function() {
          if (window.location.href.indexOf('qr-redirect.html') !== -1) {
            console.log('[QR Redirect] Still on redirect page, showing manual option');
            showManualButton();
          }
        }, 2000);
      } else if (isIOS) {
        // iOS: can't auto-redirect from WebView, must use user tap
        console.log('[QR Redirect] iOS detected, showing manual button immediately');
        document.querySelector('.spinner').style.display = 'none';
        document.querySelector('p').textContent = 'Please tap the button below to continue:';
        showManualButton();
      } else {
        // Desktop or other: direct redirect
        console.log('[QR Redirect] Direct redirect');
        window.location.href = targetUrl;
        redirected = true;
      }

      document.getElementById('manual-btn').addEventListener('click', function() {
        console.log('[QR Redirect] Manual button clicked');

        if (isAndroid) {
          // Android: Try multiple strategies in sequence
          const noScheme = targetUrl.replace(/^https?:\/\//, '');

          // Try 1: Chrome intent with BROWSABLE category
          window.location.href = 'intent://' + noScheme +
            '#Intent;scheme=https;action=android.intent.action.VIEW;' +
            'category=android.intent.category.BROWSABLE;' +
            'package=com.android.chrome;end';

          // Try 2: Generic browser intent (any browser)
          setTimeout(function() {
            window.location.href = 'intent://' + noScheme +
              '#Intent;scheme=https;action=android.intent.action.VIEW;end';
          }, 300);

          // Try 3: Direct window.open
          setTimeout(function() {
            window.open(targetUrl, '_system');
          }, 600);

          // Try 4: window.location as last resort
          setTimeout(function() {
            window.location.href = targetUrl;
          }, 900);
        } else {
          // iOS: Try multiple methods
          // Try 1: window.open with _blank
          const opened = window.open(targetUrl, '_blank');

          // Try 2: If popup blocked, try _system
          setTimeout(function() {
            if (!opened) {
              window.open(targetUrl, '_system');
            }
          }, 300);

          // Try 3: Direct navigation as fallback
          setTimeout(function() {
            window.location.href = targetUrl;
          }, 600);
        }
      });
    })();
  </script>
</body>
</html>
